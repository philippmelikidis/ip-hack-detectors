[project]
name = "ip-hack-detectors"
version = "0.1.0"
description = "Measuring what inoculation prompting prevents: do hack detectors agree?"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Philippos Melikidis" }]
dependencies = [
    "huggingface-hub>=0.30",
    "pyarrow>=18",
    "pydantic>=2.8",
    "pyyaml>=6",
]

[project.optional-dependencies]
# Real training and sampling (issues 7 and 11). The base install and CI do not need these.
# torch and transformers are held at the versions vLLM 0.33 requires, so that training and
# sampling share one environment on the GPU server.
train = [
    "accelerate>=1.15",
    "datasets>=5.1",
    "peft>=0.21",
    "torch==2.14.0",
    "transformers>=5.20,<5.21",
    "trl>=1.17",
]
# The preregistered sampling engine; Linux with CUDA only.
vllm = [
    "vllm==0.33.0; sys_platform == 'linux'",
]

[project.scripts]
ipd = "ip_hack_detectors.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The judge prompt is verbatim from PREREGISTRATION.md Appendix A, long lines included.
"src/ip_hack_detectors/d4.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs torch/transformers and a downloaded model; runs only with IPD_SLOW=1",
    "gpu: needs vLLM and a GPU (D4 judge); runs only with IPD_GPU=1",
]
