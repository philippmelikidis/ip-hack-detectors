# CI nach Philipps Standard (Skill projekt-einrichten). Job-Namen "lint" und "test" sind Pflicht-Checks im Ruleset.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uvx ruff@0.17.1 check .
      - run: uvx ruff@0.17.1 format --check .
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      # Mit pyproject.toml installiert uv das Projekt mit; bei requirements.txt: --with-requirements requirements.txt ergänzen
      - run: uv run --with pytest==9.1.1 pytest
