# Smoke run of the study model on the GPU server: Qwen2-7B, 10 eval tasks, 32 training tasks,
# 2 steps at the preregistered batch size 16, vLLM. Checks memory and the full chain at 7B
# before the pilot. The numbers mean nothing.
name: smoke-7b
tasks:
  source: hf
  repo: google-research-datasets/mbpp
  revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
  subset: sanitized
  split: test
  limit: 10
training_data:
  source: hf
  repo: google-research-datasets/mbpp
  revision: 4bb6404fdc6cacfda99d4ac4205087b89d32030c
  data_seed: 0
  limit: 32
model:
  name: Qwen/Qwen2-7B
  revision: 453ed1575b739b5b03ce3758b23befdb0967f40e
training:
  kind: trl
  max_steps: 2
conditions:
  - name: neutral
  - name: base
    untrained: true
seeds: [0]
sampling:
  n_samples: 5
  temperature: 0.5
  max_tokens: 512
backend:
  kind: vllm
sandbox:
  timeout_s: 5.0
  memory_mb: 1024
